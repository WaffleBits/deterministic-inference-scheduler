name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify CI supply-chain policy
        run: python3 tests/test_ci_supply_chain.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable as of 2026-10-16
        with:
          components: clippy, rustfmt
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Replay fixture
        run: cargo run --release -- replay --input fixtures/workload.json --output target/workload-replay.json
      - name: Priority-aging replay fixture
        run: |
          cargo run --release -- replay --input fixtures/priority_aging.json --output target/priority-aging.json
          python3 tests/validate_priority_aging.py fixtures/priority_aging.json target/priority-aging.json
      - name: Release gate fixtures
        run: |
          cargo run --release -- gate --input fixtures/release_gate_safe.json --output target/release-gate-promote.json
          cargo run --release -- gate --input fixtures/release_gate_bad.json --output target/release-gate-rollback.json
          cargo run --release -- gate --input fixtures/release_gate_numeric_tolerance.json --output target/release-gate-numeric-tolerance.json
