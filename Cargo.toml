[package]
name = "rust-inference-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic inference scheduling and release validation in Rust"
repository = "https://github.com/WaffleBits/rust-inference-runtime"
keywords = ["inference", "runtime", "rust", "scheduling", "llm"]
categories = ["simulation", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[[bin]]
name = "runtime-lab"
path = "src/main.rs"

